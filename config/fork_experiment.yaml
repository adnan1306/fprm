# Forked length-specialization experiment: fork one partially-trained
# checkpoint into 5 independent continued-training runs, each under a
# different Uniform(min_loops, max_loops) recurrent-computation-length
# regime. Consumed by scripts/submit_fork_array.sh (SLURM array) and
# scripts/verify_fork_checkpoints.py — not Hydra-composed, plain YAML.
#
# min_loops/max_loops below are chosen against the base Maze-Hard run's
# original max_iter=24 (config/cfg_pretrain_maze.yaml, arch.max_iter_dist:
# det) — "medium" centers on that original cap, "long" extends toward the
# eval-time length-generalization cap (arch.max_iter_eval: 1000). Starting
# values, not tuned — edit before launching if a different spread is wanted.

base_checkpoint: /home/m7adnan/scratch/fprm/checkpoints/step_32550
output_root: /home/m7adnan/scratch/fprm/fork_experiment
seed_base: 1000               # fork seed = seed_base + regime.id
# epochs override = base_epochs + additional_epochs_budget (rounded up to a
# multiple of eval_interval). 0 = leave epochs exactly as the base run had
# it (correct when the checkpoint isn't near the end of its original
# schedule — there's already budget left to train within). Only raise this
# if the base checkpoint is close to/at its original epochs and you want to
# give the forks more room to train past that point.
additional_epochs_budget: 0
wandb_group: fprm-length-fork-2026-08-24
early_stop_patience_evals: null    # null disables; set an int (# of evals) to enable
early_stop_metric_key: eval/lm_loss   # matches models/losses.py's ACTLossHead metrics key
early_stop_min_delta: 0.0

regimes:
  - id: 0
    name: short
    min_loops: 1
    max_loops: 8
  - id: 1
    name: short_medium
    min_loops: 4
    max_loops: 16
  - id: 2
    name: medium
    min_loops: 8
    max_loops: 24
  - id: 3
    name: medium_long
    min_loops: 16
    max_loops: 48
  - id: 4
    name: long
    min_loops: 24
    max_loops: 96
